[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portfolio-api"
version = "0.1.0"
description = "FastAPI + LlamaIndex RAG assistant for the portfolio site"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "llama-index-core>=0.12.0",
  "llama-index-llms-google-genai>=0.6.0",
  "llama-index-embeddings-google-genai>=0.3.0",
  "llama-index-vector-stores-chroma>=0.4.0",
  "chromadb>=0.5.0",
  "tavily-python>=0.5.0",
]

[project.scripts]
portfolio-ingest = "portfolio_api.ingest:main"

[tool.hatch.build.targets.wheel]
packages = ["portfolio_api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
